name: Knobs
options:
  bundleIdPrefix: io.segall.knobs
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  KnobsKit:
    type: framework
    platform: macOS
    sources:
      - path: KnobsKit
        type: syncedFolder
    preBuildScripts:
      - name: Generate plugin registry
        script: '"$SRCROOT/scripts/generate-registry.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.segall.knobs.kit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        # Every .metal file is a Core Image kernel.
        MTL_COMPILER_FLAGS: -fcikernel
        MTLLINKER_FLAGS: -fcikernel
        MTL_HEADER_SEARCH_PATHS: $(SRCROOT)/KnobsKit/Engine/Metal

  Knobs:
    type: application
    platform: macOS
    sources:
      - path: Knobs
        type: syncedFolder
      # A synced folder gets no resources phase from xcodegen, so the asset catalog lives outside it.
      - path: KnobsResources
    dependencies:
      - target: KnobsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.segall.knobs
        PRODUCT_NAME: Knobs
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Knobs
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  knobs-render:
    type: tool
    platform: macOS
    sources:
      - path: KnobsRender
        type: syncedFolder
    dependencies:
      - target: KnobsKit
        embed: false
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: "@executable_path"

  KnobsKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KnobsKitTests
        type: syncedFolder
    dependencies:
      - target: KnobsKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Knobs:
    build:
      targets:
        Knobs: all
        knobs-render: all
    run:
      executable: Knobs
    test:
      targets:
        - KnobsKitTests
